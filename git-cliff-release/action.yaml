name: Prepare release metadata using git-cliff
description: Prepare release metadata based on conventional commits using git-cliff
inputs:
  release_type:
    description: Release type
    required: true
    type: choice
    default: auto
    options:
      - auto
      - prerelease
      - patch
      - minor
      - major
      - custom
  custom_version:
    description: The custom version to bump to (only for "custom" type), with or without a leading "v"
    required: false
    type: string
    default: ""
  prerelease_id:
    description: |
      Pre-release identifier used when release_type is "prerelease" - one of "alpha", "beta" or "rc".
      Doubles as the npm dist-tag in most setups.
    required: false
    type: string
    default: beta
  prerelease_registry:
    description: |
      Registry to probe for the highest already-published pre-release number - one of "npm", "pypi" or
      "crates". Empty skips pre-release version resolution and leaves the prerelease_number and
      prerelease_version outputs empty; setting it also requires prerelease_package.
    required: false
    type: string
    default: ""
  prerelease_package:
    description: Name of the package or crate to look up in prerelease_registry. Required alongside it.
    required: false
    type: string
    default: ""
  cliff_config_path:
    description: Path to a custom git-cliff configuration file
    required: false
    type: string
    default: cliff.toml
  existing_changelog_path:
    description: Path to an existing changelog. If given, the new changelog contents will be prepended to it intelligently.
    required: false
    type: string
    default: ""
  changelog_artifact_name:
    description: |
      Name of the artifact the generated changelog is uploaded as. The artifact holds a single file named
      CHANGELOG.md. Set this when a single workflow run calls this action more than once.
    required: false
    type: string
    default: git-cliff-changelog
  token:
    description: Github token to be used by github CLI
    required: false
    type: string
    default: ${{ github.token }}
  add-github-links:
    description: If set to false, the action will not insert links to GitHub issues and PRs in the release notes and changelog.
    required: false
    type: boolean
    default: true
outputs:
  is_prerelease:
    description: For convenience - was the action triggered with release_type = "prerelease"?
    value: ${{ steps.version_number.outputs.is_prerelease }}
  version_number:
    description: Version number of the new release (no leading "v")
    value: ${{ steps.version_number.outputs.version_number }}
  tag_name:
    description: Tag name for the new release (with a leading "v")
    value: ${{ steps.version_number.outputs.tag_name }}
  prerelease_id:
    description: |
      The prerelease_id input, echoed for convenience - it doubles as the npm dist-tag. Empty under the
      same conditions as prerelease_number, so it cannot tag a stable release as a pre-release.
    value: ${{ steps.prerelease.outputs.prerelease_id }}
  prerelease_number:
    description: |
      One more than the highest pre-release number already published for version_number under
      prerelease_id. Empty unless release_type is "prerelease" and prerelease_registry is set.
    value: ${{ steps.prerelease.outputs.prerelease_number }}
  prerelease_version:
    description: |
      Semver-flavoured pre-release version for npm and crates.io, e.g. "1.2.4-beta.7". Empty under the
      same conditions as prerelease_number.
    value: ${{ steps.prerelease.outputs.prerelease_version }}
  prerelease_version_pep440:
    description: |
      PEP 440-flavoured pre-release version for PyPI, e.g. "1.2.4b7". Empty under the same conditions as
      prerelease_number.
    value: ${{ steps.prerelease.outputs.prerelease_version_pep440 }}
  release_notes:
    description: Release notes for the new release
    value: ${{ steps.release_notes.outputs.release_notes }}
  changelog:
    description: |
      The complete changelog. Only usable while it stays below 128 KiB - passing a larger value to another
      action's input makes that action fail to start. Prefer the changelog_artifact_name output.
    value: ${{ steps.changelog.outputs.changelog }}
  changelog_artifact_name:
    description: Name of the artifact holding the generated changelog as a single CHANGELOG.md file
    value: ${{ inputs.changelog_artifact_name }}
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        path: ${{ github.workspace }}/__release_metadata_repo
    - name: Install git-cliff
      shell: bash
      run: pip install 'git-cliff<2.11.0'
    - name: Locally remove pre-release tags
      shell: bash
      working-directory: ${{ github.workspace }}/__release_metadata_repo
      run: |
        if git tag | grep -e '[ab][0-9]' -e 'rc[0-9]' -e '-beta\.' -e '-alpha\.' -e '-rc\.' > /dev/null 2> /dev/null; then
          git tag | grep -e '[ab][0-9]' -e 'rc[0-9]' -e '-beta\.' -e '-alpha\.' -e '-rc\.' | xargs -r git tag --delete
        fi
    - name: Determine version number
      id: version_number
      shell: bash
      env:
        GIT_CLIFF_CONFIG: ${{ inputs.cliff_config_path }}
        GIT_CLIFF_REPOSITORY: ${{ github.workspace }}/__release_metadata_repo
        GIT_CLIFF_WORKDIR: ${{ github.action_path }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -x
        if [[ '${{ inputs.release_type }}' = custom ]]; then
          version_number=$(echo ${{ inputs.custom_version }} | sed s/^v//)
        elif [[ '${{ inputs.release_type }}' = auto ]]; then
          version_number=$(git-cliff --bumped-version | sed s/^v//)

          # If there are no commits that increase semver, break.
          # In a repo with no tags yet there is always something to release, and
          # git describe would fail with a non-zero exit - guard against that.
          if latest_tag=$(git describe --tags --abbrev=0 2> /dev/null) && [[ "$latest_tag" = "v${version_number}" ]]; then
            echo "::error title=Nothing to release::There were no commits that trigger a version bump since the last release"
            exit 1
          fi
        elif [[ '${{ inputs.release_type }}' = prerelease ]]; then
          # Prereleases only ever increase the patch version
          version_number=$(git-cliff --bump patch --unreleased --context | jq -r '.[0].version' | sed s/^v//)
        else
          version_number=$(git-cliff --bump '${{ inputs.release_type }}' --unreleased --context | jq -r '.[0].version' | sed s/^v//)
        fi
        echo version_number=$version_number | tee -a $GITHUB_OUTPUT
        echo tag_name=v$version_number | tee -a $GITHUB_OUTPUT
        echo is_prerelease=${{ inputs.release_type == 'prerelease' }} | tee -a $GITHUB_OUTPUT
    - name: Resolve pre-release version
      id: prerelease
      if: inputs.release_type == 'prerelease'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        BASE_VERSION: ${{ steps.version_number.outputs.version_number }}
        PRERELEASE_ID: ${{ inputs.prerelease_id }}
        PRERELEASE_PACKAGE: ${{ inputs.prerelease_package }}
        PRERELEASE_REGISTRY: ${{ inputs.prerelease_registry }}
      run: |
        set -exo pipefail # A failed lookup must not be masked by tee's exit status.
        if [[ -z "$PRERELEASE_REGISTRY" && -z "$PRERELEASE_PACKAGE" ]]; then
          echo 'Pre-release version resolution is not configured, skipping.'
          exit 0
        fi

        if [[ -z "$PRERELEASE_REGISTRY" || -z "$PRERELEASE_PACKAGE" ]]; then
          echo '::error title=Incomplete pre-release configuration::Set both prerelease_registry and prerelease_package, or neither.'
          exit 1
        fi

        python next_prerelease.py \
          --registry "$PRERELEASE_REGISTRY" \
          --package "$PRERELEASE_PACKAGE" \
          --base-version "$BASE_VERSION" \
          --prerelease-id "$PRERELEASE_ID" |
          tee -a "$GITHUB_OUTPUT"
    - name: Generate release notes
      id: release_notes
      shell: bash
      env:
        GIT_CLIFF_CONFIG: ${{ inputs.cliff_config_path }}
        GIT_CLIFF_REPOSITORY: ${{ github.workspace }}/__release_metadata_repo
        GIT_CLIFF_WORKDIR: ${{ github.action_path }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ inputs.token }}
      working-directory: ${{ github.action_path }}
      run: |
        set -x
        enhance_context_args=()

        if [[ ${{ inputs.add-github-links }} = false ]]; then
          enhance_context_args+=(--no-github)
        fi

        echo 'release_notes<<EOF' >> $GITHUB_OUTPUT
        git-cliff --tag "${{ steps.version_number.outputs.tag_name }}" --unreleased --context |
          python enhance_context.py --repo $GITHUB_REPO --release-notes "${enhance_context_args[@]}" |
          git-cliff --from-context - --strip all |
          tee -a $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
    - name: Generate changelog
      id: changelog
      shell: bash
      env:
        GIT_CLIFF_CONFIG: ${{ inputs.cliff_config_path }}
        GIT_CLIFF_REPOSITORY: ${{ github.workspace }}/__release_metadata_repo
        GIT_CLIFF_WORKDIR: ${{ github.action_path }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ inputs.token }}
      working-directory: ${{ github.action_path }}
      run: |
        set -x
        dump_context_args=()
        enhance_context_args=()
        print_changelog_args=()

        out_file=$GIT_CLIFF_WORKDIR/new_changelog.md

        if [[ -n "${{ inputs.existing_changelog_path }}" ]]; then
          out_file=$GIT_CLIFF_WORKDIR/existing_changelog.md
          cp "$GIT_CLIFF_REPOSITORY/${{ inputs.existing_changelog_path }}" $out_file
          sed '/<!-- git-cliff-unreleased-start -->/,/<!-- git-cliff-unreleased-end -->/d' -i $out_file

          dump_context_args+=(--unreleased)
          print_changelog_args+=(--prepend "$out_file" --unreleased)
        else
          print_changelog_args+=(--output "$out_file")
        fi

        if [[ ${{ inputs.add-github-links }} = false ]]; then
          enhance_context_args+=(--no-github)
        fi

        if [[ ${{ inputs.release_type }} = prerelease ]]; then
          enhance_context_args+=(--unreleased-version "${{ steps.version_number.outputs.tag_name }}")
        else
          dump_context_args+=(--tag "${{ steps.version_number.outputs.tag_name }}")
        fi

        git-cliff --context "${dump_context_args[@]}" |
          python enhance_context.py --repo $GITHUB_REPO "${enhance_context_args[@]}" |
          git-cliff --from-context - "${print_changelog_args[@]}"

        sed -i '$a\' $out_file # Make sure there is a newline at the end of the output file

        # Stage the changelog for the artifact upload. Consumers that receive the changelog through an
        # action or workflow input are limited to 128 KiB - inputs are passed as environment variables and
        # the kernel refuses to start a process with a longer one. The artifact has no such limit.
        mkdir -p $RUNNER_TEMP/git-cliff-changelog
        cp $out_file $RUNNER_TEMP/git-cliff-changelog/CHANGELOG.md

        echo 'changelog<<EOF' >> $GITHUB_OUTPUT
        cat $out_file >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
    - name: Upload changelog artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.changelog_artifact_name }}
        path: ${{ runner.temp }}/git-cliff-changelog/CHANGELOG.md
        if-no-files-found: error
        retention-days: 7 # Enough to keep a later re-run of the failed jobs working.
        overwrite: true
    - name: Clean up
      shell: bash
      env:
        GIT_CLIFF_REPOSITORY: ${{ github.workspace }}/__release_metadata_repo
      run: |
        rm -rf $GIT_CLIFF_REPOSITORY
