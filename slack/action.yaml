name: "Slack notification"
description: "Send a Slack message about a job with a status color (blue when started, green on success, red otherwise)"

inputs:
  slack-channel-id:
    description: "Slack Channel ID"
    required: true
  subject:
    description: "Subject of message (i.e. deploy, tests,..)"
    required: true
  revision:
    description: "Revision (semver, short commit sha,..). Defaults to the short commit SHA."
    required: false
    default: ""
  actor-override:
    description: "Override the author of event"
    required: false
    default: ""
  job-status:
    description: "Determines the color and status of message. If omitted blue info message is sent"
    required: false
    default: ""
  slack-token:
    description: "Slack API token"
    required: true

runs:
  using: "composite"
  steps:
    - name: format message
      id: format
      shell: bash
      env:
        INPUT_JOB_STATUS: ${{ inputs.job-status }}
        INPUT_REVISION: ${{ inputs.revision }}
      run: |
        jobStatus="$INPUT_JOB_STATUS"
        if [ "$INPUT_JOB_STATUS" = "" ]; then
            color="#0066ff"
            emoji=large_blue_circle
            jobStatus="started"
        elif [ "$INPUT_JOB_STATUS" = "success" ]; then
            color="#00cc00"
            emoji=large_green_circle
        else
            color="#ff0000"
            emoji=red_circle
        fi

        if [ "$INPUT_REVISION" = "" ]; then
            revision=${GITHUB_SHA::10}
        else
            revision=$INPUT_REVISION
        fi

        echo "color=${color}" >> $GITHUB_OUTPUT
        echo "emoji=${emoji}" >> $GITHUB_OUTPUT
        echo "revision=${revision}" >> $GITHUB_OUTPUT
        echo "jobStatus=${jobStatus}" >> $GITHUB_OUTPUT

    - name: send message
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        payload: |
          {
            "channel": "${{ inputs.slack-channel-id }}",
            "text": ":${{ steps.format.outputs.emoji }}: *${{ github.repository }} ${{ inputs.subject }} ${{ steps.format.outputs.jobStatus }}*",
            "attachments": [
              {
                "color": "${{ steps.format.outputs.color }}",
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Author:* ${{ inputs.actor-override || github.actor }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Revision:* ${{ steps.format.outputs.revision }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Details:* <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|trigger>, <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered by:* ${{ github.event_name }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
