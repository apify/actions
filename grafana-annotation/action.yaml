name: "Grafana annotation"
description: "Create a Grafana annotation, or close out an existing one by setting its end time to now"

inputs:
  grafana-annotation-tags:
    description: "Custom annotation tags, one per line"
    required: false
    default: ""
  grafana-annotation-text:
    description: "Custom annotation text"
    required: true
  grafana-annotation-id:
    description: "Annotation Id. When set, the annotation is closed out instead of created."
    required: false
    default: ""
  grafana-api-token:
    description: "Grafana API token"
    required: true

outputs:
  annotation-id:
    description: "Annotation Id"
    value: ${{ steps.grafana.outputs.annotation-id }}

runs:
  using: "composite"
  steps:
    - name: Add grafana annotation
      id: grafana
      shell: bash
      env:
        GRAFANA_ANNOTATION_ID: ${{ inputs.grafana-annotation-id }}
        GRAFANA_ANNOTATION_TAGS: ${{ inputs.grafana-annotation-tags }}
        GRAFANA_ANNOTATION_TEXT: ${{ inputs.grafana-annotation-text }}
        GRAFANA_TOKEN: ${{ inputs.grafana-api-token }}
        GRAFANA_HOST: "https://grafana.apify.dev"
      run: |
        set -euo pipefail

        endpoint="$GRAFANA_HOST/api/annotations"

        # Convert newline-separated tags into a JSON array, dropping empty lines.
        tags_json=$(printf '%s' "$GRAFANA_ANNOTATION_TAGS" \
                      | jq -Rn '[inputs | select(. != "")]')

        # Determine whether to create (POST) or close out (PATCH) the annotation.
        # PATCH mirrors the archived action: it only updates the annotation's
        # end time to "now" (milliseconds since epoch).
        if [[ -n "${GRAFANA_ANNOTATION_ID:-}" ]]; then
          method='PATCH'
          endpoint="$endpoint/$GRAFANA_ANNOTATION_ID"
          body=$(jq -n --argjson timeEnd "$(date +%s%3N)" \
                        '{timeEnd: $timeEnd}')
        else
          method='POST'
          body=$(jq -n \
                    --arg text "$GRAFANA_ANNOTATION_TEXT" \
                    --argjson tags "$tags_json" \
                    '{tags: $tags, text: $text}')
        fi

        response=$(curl --fail --retry 3 --silent --show-error \
          -X "$method" "$endpoint" \
          --header "Authorization: Bearer $GRAFANA_TOKEN" \
          --header 'Content-Type: application/json' \
          --data "$body")

        if [[ "$method" == 'POST' ]]; then
          id=$(jq -r '.id' <<< "$response")
          echo "annotation-id=$id" >> "$GITHUB_OUTPUT"
        else
          echo "annotation-id=$GRAFANA_ANNOTATION_ID" >> "$GITHUB_OUTPUT"
        fi
