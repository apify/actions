name: "Create release"
description: "Create a release (changelog, GitHub release, Slack notification) using apify/release-pr-action"

# The caller chooses `runs-on` (the original workflow used ubuntu-22.04-arm64).

inputs:
  revision:
    description: "Tag given to container image (shown in the failure message)"
    required: false
    default: ""
  changelog-scopes:
    description: 'Changelog scopes (i.e { "App": ["app", "application"] })'
    required: true
  changelog-method:
    description: "How to fetch changelog"
    required: false
    default: pull_request_description
  release-name-method:
    description: "How to fetch next release name"
    required: false
    default: branch
  slack-channel-id:
    description: "Slack Channel ID for changelog"
    required: false
    default: ""
  slack-channel-id-for-failure-msg:
    description: "Slack Channel ID for failure messages"
    required: false
    default: ""
  release-name:
    description: "This value overrides release name got from release branch name"
    required: false
    default: ""
  release-name-prefix:
    description: "Prepend prefix to releaseName"
    required: false
    default: "v"
  base-branch:
    description: "Base branch against which to create pull request"
    required: false
    default: master
  actor-override:
    description: "Override the author of event"
    required: false
    default: ""
  slack-token:
    description: "Slack API token"
    required: false
    default: ""
  open-ai-token:
    description: "Open AI token"
    required: false
    default: ""
  github-token:
    description: "GitHub token"
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: get changelog
      id: changelog
      uses: apify/release-pr-action@5d8b596e568d2c64fe125f41b30787433cfd0998 # v3.8.0
      with:
        slack-token: ${{ inputs.slack-token }}
        github-token: ${{ inputs.github-token }}
        changelog-scopes: ${{ inputs.changelog-scopes }}
        release-name-prefix: ${{ inputs.release-name-prefix }}
        slack-channel: ${{ inputs.slack-channel-id }}
        changelog-method: ${{ inputs.changelog-method }}
        release-name-method: ${{ inputs.release-name-method }}
        base-branch: ${{ inputs.base-branch }}
        create-github-release: true
        open-ai-token: ${{ inputs.open-ai-token }}

    - name: report failure to slack
      if: failure() && inputs.slack-channel-id-for-failure-msg != ''
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        payload: |
          {
            "channel": "${{ inputs.slack-channel-id-for-failure-msg }}",
            "text": ":red_circle: *${{ github.repository }} automated release action: ${{ job.status }}*",
            "attachments": [
              {
                "color": "#ff0000",
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Author:* ${{ inputs.actor-override || github.actor }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Revision:* ${{ inputs.revision }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Details:* <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|trigger>, <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered by:* ${{ github.event_name }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
