name: "Create prod release"
description: "Create a new release branch, the first step for deployment to staging and production"

# Validates the current branch (`develop` for a standard release, `master` for a hotfix), checks there is no pending
# release PR, checks `develop` is in sync with the base branch, and creates the release branch with a GitHub App
# installation token (the default GITHUB_TOKEN cannot trigger workflows on the new branch).

inputs:
  release-branch-prefix:
    description: "Prefix used for release branch names"
    required: false
    default: release
  base-branch:
    description: "Branch treated as production base (patch releases cut from here)"
    required: false
    default: master
  github-token:
    description: "Token used to list pull requests, releases and compare branches"
    required: false
    default: ${{ github.token }}
  github-app-id:
    description: "ID or client ID of the GitHub App used to create the release branch"
    required: true
  github-app-private-key:
    description: "Private key of the GitHub App used to create the release branch"
    required: true

runs:
  using: "composite"
  steps:
    - name: Ensure workflow runs on develop or master
      shell: bash
      env:
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if [ "$CURRENT_BRANCH" != "develop" ] && [ "$CURRENT_BRANCH" != "master" ]; then
          echo "::error::This workflow must be run from 'develop' (standard release) or 'master' (hotfix release). Got '$CURRENT_BRANCH'."
          exit 1
        fi

    - name: Check if there are no pending releases
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RELEASE_BRANCH_PREFIX: ${{ inputs.release-branch-prefix }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pullRequests = await github.paginate(github.rest.pulls.list, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 100,
          });

          // Match `<prefix>/...` exactly, so e.g. `release-notes-x` is not mistaken for a release branch.
          const releasePRs = pullRequests.filter(pr => pr.head.ref.startsWith(`${process.env.RELEASE_BRANCH_PREFIX}/`));

          if (releasePRs.length > 0) {
            core.setFailed(`There is already a pending release PR: ${releasePRs[0].title} (${releasePRs[0].html_url}). Please finish the existing release first.`);
          }

    - name: Check if develop is in sync with master
      if: github.ref_name == 'develop'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const baseBranch = process.env.BASE_BRANCH;
          const currentBranch = process.env.CURRENT_BRANCH;

          const { data: { behind_by } } = await github.rest.repos.compareCommitsWithBasehead({
            owner: context.repo.owner,
            repo: context.repo.repo,
            basehead: `${baseBranch}...${currentBranch}`,
          });

          core.info(`develop is ${behind_by} commits behind master`);

          if (behind_by > 0) {
            core.setFailed(`${currentBranch} is not in sync with ${baseBranch}. Please merge the changes into ${currentBranch} first (do not squash!).`);
          }

    # The default GITHUB_TOKEN cannot trigger workflows on the new release branch.
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-private-key }}
        permission-contents: write

    - name: Create release branch
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RELEASE_BRANCH_PREFIX: ${{ inputs.release-branch-prefix }}
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const VERSION_REGEX = /^v(\d+)\.(\d+)\.(\d+)/;

          function bumpReleaseName(currentReleaseName, mode) {
            const [, major, minor, patch] = currentReleaseName.match(VERSION_REGEX);
            if (mode === 'minor') return `v${major}.${parseInt(minor) + 1}.0`;
            if (mode === 'patch') return `v${major}.${minor}.${parseInt(patch) + 1}`;
            throw new Error(`Unknown bump mode ${mode}`);
          }

          // Newest first. Skip drafts, prereleases and releases that aren't named like `v1.2.3`.
          const releases = await github.paginate(github.rest.repos.listReleases, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100,
          });
          const currentRelease = releases.find(
            (release) => !release.draft && !release.prerelease && VERSION_REGEX.test(release.name ?? ''),
          );
          if (!currentRelease) {
            throw new Error('No published release named like `v1.2.3` found, cannot work out the next version.');
          }
          const currentVersionName = currentRelease.name;
          core.info(`Current release: ${currentVersionName}`);

          const bumpMode = process.env.CURRENT_BRANCH === 'master' ? 'patch' : 'minor';
          const nextVersionName = bumpReleaseName(currentVersionName, bumpMode);
          const releaseBranchName = `${process.env.RELEASE_BRANCH_PREFIX}/${nextVersionName}`;

          core.info(`Creating release branch: ${releaseBranchName} (${bumpMode} bump)`);
          await github.rest.git.createRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: `refs/heads/${releaseBranchName}`,
            sha: context.sha,
          });

          core.info(`Release branch ${releaseBranchName} created. The release PR will be created automatically.`);
