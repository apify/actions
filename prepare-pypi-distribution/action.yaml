name: "Prepare PyPI distribution"
description: "Prepares a Python package for distribution on PyPI, including setting the version number and building the package."

inputs:
  package_name:
    required: true
    type: string
  version_number:
    required: true
    type: string
  is_prerelease:
    required: true
    type: string
  ref:
    required: true
    type: string
  python_version:
    required: false
    type: string
    default: "3.14" # The newest Python version.
  install_command:
    description: Command to install Python dependencies.
    required: false
    type: string
    default: uv run poe install-dev
  build_command:
    description: Command to build package.
    required: false
    type: string
    default: uv run poe build

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Set up uv package manager
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install dependencies
      shell: bash
      run: ${{ inputs.install_command }}

    # Updates the version number in the project's configuration.
    - name: Set version in pyproject.toml
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        VERSION_NUMBER: ${{ inputs.version_number }}
        IS_PRERELEASE: ${{ inputs.is_prerelease }}
      run: |
        if [ -n "$IS_PRERELEASE" ]; then
          # The beta number is appended to this version, so it must be a plain release version.
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version number::Expected a version such as 1.2.3, got ${VERSION_NUMBER@Q}"
            exit 1
          fi
          next_beta=$(
            curl "https://pypi.org/pypi/${PACKAGE_NAME}/json" | jq --raw-output --arg prefix "${VERSION_NUMBER}b" '
              [
                .releases |
                  keys |
                  .[] |
                  select(startswith($prefix)) |
                  split("b") |
                  .[1] |
                  tonumber
              ] |
              sort_by(- .) |
              .[0] + 1
            '
          )
          new_version="${VERSION_NUMBER}b${next_beta}"
          echo "Updating version in pyproject.toml to ${new_version}"
          uv version "${new_version}"
        fi

    # Builds the package.
    - name: Build package
      shell: bash
      run: ${{ inputs.build_command }}
