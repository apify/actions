name: "Python lint check"
description: "Run the lint check of a Python project for a single Python version (use a job matrix in the caller to cover several)"

inputs:
  python-version:
    description: "Python version to be used."
    required: true
  install-command:
    description: "Command to install Python dependencies."
    required: false
    default: uv run poe install-dev
  lint-check-command:
    description: "Command to run lint check."
    required: false
    default: uv run poe lint

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv package manager
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python dependencies
      shell: bash
      run: ${{ inputs.install-command }}

    - name: Run lint check
      shell: bash
      run: ${{ inputs.lint-check-command }}
