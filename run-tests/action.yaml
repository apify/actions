name: "Run tests"
description: "Install npm dependencies and run test scripts, with Slack notifications"

inputs:
  node-version-file:
    description: "Path to node version file"
    required: false
    default: .nvmrc
  npm-registry-url:
    description: "NPM registry url"
    required: false
    default: https://npm.pkg.github.com/
  npm-scope:
    description: "NPM scope"
    required: true
  scripts:
    description: |
      Scripts to run after `npm install`, as in package.json (e.g. `npm run build` and `npm run test` on separate lines)
    required: true
  title:
    description: "Title displayed in slack message"
    required: false
    default: "integration tests"
  revision:
    description: "Revision that is being tested (This is strictly informative)"
    required: false
    default: ""
  slack-channel-id:
    description: "Slack Channel ID"
    required: false
    default: ""
  actor-override:
    description: "Override the author of event"
    required: false
    default: ""
  env-variables:
    description: "Space separated list of environment variables to be set during test phase (e.g. `FOO=bar BAR=foo`)"
    required: false
    default: ""
  npm-token:
    description: "NPM token"
    required: false
    default: ""
  slack-token:
    description: "Slack API token"
    required: false
    default: ""
  test-user-api-token:
    description: "API token of test user"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Send notification to slack
      if: inputs.slack-channel-id != ''
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        payload: |
          {
              "channel": "${{ inputs.slack-channel-id }}",
              "text": ":large_blue_circle: *${{ github.repository }} ${{ inputs.title }} started*",
              "attachments": [
                {
                  "color": "#0066ff",
                  "blocks": [
                    {
                      "type": "section",
                      "fields": [
                      {"type": "mrkdwn", "text": "*Author:* ${{ inputs.actor-override || github.actor }}"},
                      {"type": "mrkdwn", "text": "*Revision:* ${{ inputs.revision }}"},
                      {"type": "mrkdwn", "text": "*Details:* <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|trigger>, <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"},
                      {"type": "mrkdwn", "text": "*Triggered by:* ${{ github.event_name }}"}
                    ]
                    }
                  ]
                }
              ]
            }

    - name: clone local repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # TODO: turn on caching
    - name: setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.npm-registry-url }}
        scope: ${{ inputs.npm-scope }}

    - name: run tests
      shell: bash
      env:
        ENV_VARIABLES: ${{ inputs.env-variables }}
        INPUT_NPM_TOKEN: ${{ inputs.npm-token }}
        INPUT_TEST_USER_API_TOKEN: ${{ inputs.test-user-api-token }}
        SCRIPTS: ${{ inputs.scripts }}
      run: |
        if [ "$ENV_VARIABLES" != "" ]; then
            export $(echo $ENV_VARIABLES)
        fi

        if [ "$INPUT_NPM_TOKEN" != "" ]; then
            export NODE_AUTH_TOKEN=$INPUT_NPM_TOKEN
        fi

        if [ "$INPUT_TEST_USER_API_TOKEN" != "" ]; then
            export TEST_USER_API_TOKEN=$INPUT_TEST_USER_API_TOKEN
        fi

        npm install
        eval "$SCRIPTS"

    - name: helper - get slack message formatting
      id: slack-helper
      if: always() && inputs.slack-channel-id != ''
      shell: bash
      env:
        JOB_STATUS: ${{ job.status }}
      run: |
        if [ "$JOB_STATUS" = "success" ]; then
          echo "color=#00cc00" >> "$GITHUB_OUTPUT"
          echo "emoji=large_green_circle" >> "$GITHUB_OUTPUT"
        else
          echo "color=#ff0000" >> "$GITHUB_OUTPUT"
          echo "emoji=red_circle" >> "$GITHUB_OUTPUT"
        fi

    - name: send result to slack
      if: always() && inputs.slack-channel-id != ''
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        payload: |
          {
              "channel": "${{ inputs.slack-channel-id }}",
              "text": ":${{ steps.slack-helper.outputs.emoji }}: *${{ github.repository }} ${{ inputs.title }} result: ${{ job.status }}*",
              "attachments": [
                {
                  "color": "${{ steps.slack-helper.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "fields": [
                      {"type": "mrkdwn", "text": "*Author:* ${{ inputs.actor-override || github.actor }}"},
                      {"type": "mrkdwn", "text": "*Revision:* ${{ inputs.revision }}"},
                      {"type": "mrkdwn", "text": "*Details:* <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|trigger>, <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"},
                      {"type": "mrkdwn", "text": "*Triggered by:* ${{ github.event_name }}"}
                    ]
                    }
                  ]
                }
              ]
            }
