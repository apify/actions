name: "Bump version and update changelog"
description: "Bump the package version in pyproject.toml, write the changelog, and push a signed commit"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.14" # The newest Python version.
  version-number:
    description: 'Version number of the new release (no leading "v")'
    required: true
  changelog:
    description: |
      Deprecated: the complete changelog as a string. Used only when the changelog artifact is missing,
      and unusable once the changelog grows over 128 KiB. Callers on
      apify/actions/git-cliff-release v1.4.1 or newer should stop passing it.
    required: false
    default: ""
  changelog-artifact-name:
    description: "Name of the artifact holding the changelog, as uploaded by apify/actions/git-cliff-release"
    required: false
    default: git-cliff-changelog
  changelog-path:
    description: "Path to the changelog file within the repository"
    required: false
    default: CHANGELOG.md
  apify-service-account-github-token:
    description: "GitHub token of the Apify service account, used to check out the repository and push the commit"
    required: true

outputs:
  changelog-commitish:
    description: "Git HEAD after the commit and push"
    value: ${{ steps.commit.outputs.commit_long_sha }}

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.apify-service-account-github-token }}

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv package manager
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}

    - name: Update package version in pyproject.toml
      shell: bash
      env:
        NEW_VERSION: ${{ inputs.version-number }}
      run: |
        # PyPI does not accept local versions, so a `+` suffix is rejected here.
        if [[ ! "${NEW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$ ]]; then
          echo "::error title=Invalid version number::Expected a version such as 1.2.3 or 1.2.3rc1, got ${NEW_VERSION@Q}"
          exit 1
        fi
        echo "Updating version in pyproject.toml to ${NEW_VERSION}"
        uv version "${NEW_VERSION}"

    # The changelog is handed over as an artifact instead of a string input, because an action input is
    # passed to the action as an environment variable and Linux caps a single environment variable at
    # 128 KiB - past that the step fails to start with "Argument list too long".
    - name: Download changelog artifact
      id: changelog_artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        name: ${{ inputs.changelog-artifact-name }}
        path: ${{ runner.temp }}/changelog

    - name: Update the changelog
      if: ${{ steps.changelog_artifact.outcome == 'success' }}
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.changelog-artifact-name }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        DOWNLOADED_CHANGELOG: ${{ runner.temp }}/changelog/CHANGELOG.md
      run: |
        set -euo pipefail

        if [[ ! -s "${DOWNLOADED_CHANGELOG}" ]]; then
          echo "::error::Artifact '${ARTIFACT_NAME}' holds no non-empty CHANGELOG.md"
          exit 1
        fi

        echo "Writing $(wc -c < "${DOWNLOADED_CHANGELOG}") bytes to ${CHANGELOG_PATH}"
        mv "${DOWNLOADED_CHANGELOG}" "${CHANGELOG_PATH}"

    - name: Fail on a missing changelog
      if: ${{ steps.changelog_artifact.outcome != 'success' && inputs.changelog == '' }}
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.changelog-artifact-name }}
      run: |
        echo "::error::Neither the '${ARTIFACT_NAME}' artifact nor the 'changelog' input carries a changelog"
        exit 1

    # Deprecated path for callers still on apify/actions/git-cliff-release older than v1.4.1, which does
    # not upload the artifact. Drop it, together with the 'changelog' input, once every caller is bumped.
    - name: Update the changelog from the input
      if: ${{ steps.changelog_artifact.outcome != 'success' }}
      uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
      with:
        path: ${{ inputs.changelog-path }}
        write-mode: overwrite
        contents: ${{ inputs.changelog }}

    # The 'changelog' input travels through a $GITHUB_OUTPUT heredoc, which strips the trailing
    # newline, so the input path above writes the file without one. Normalize here so the committed
    # changelog always ends with a newline, whichever path wrote it.
    - name: Ensure the changelog ends with a newline
      shell: bash
      env:
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
      run: sed -i -e '$a\' "${CHANGELOG_PATH}"

    - name: Commit changes
      id: commit
      uses: apify/actions/signed-commit@48ab27d3d0de7744c20dd783b83245dfae2cddfd # v1.7.0
      with:
        message: "chore(release): Update changelog and package version [skip ci]"
        pull: '--rebase --autostash'
        github-token: ${{ inputs.apify-service-account-github-token }}
