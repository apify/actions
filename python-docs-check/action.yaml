name: "Docs check"
description: "Build the docs website of a Python project to check it builds"

inputs:
  python-version:
    description: "Python version to use for building docs."
    required: false
    default: "3.14"
  node-version:
    description: "Node.js version to use for building docs."
    required: false
    default: "24"
  install-command:
    description: "Command to install Python dependencies."
    required: false
    default: uv run poe install-dev
  build-docs-command:
    description: "Command to build docs website."
    required: false
    default: uv run poe build-docs
  apify-signing-token:
    description: "Token for signing Apify packages."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable corepack
      shell: bash
      run: |
        corepack enable
        corepack prepare yarn@stable --activate

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv package manager
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Python dependencies
      shell: bash
      run: ${{ inputs.install-command }}

    - name: Build docs website
      shell: bash
      run: ${{ inputs.build-docs-command }}
      env:
        APIFY_SIGNING_TOKEN: ${{ inputs.apify-signing-token }}
