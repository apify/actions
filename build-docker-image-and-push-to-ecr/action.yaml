name: "Build Docker image and push it to ECR"
description: "Build a Docker image with Buildx and push it to an ECR registry, optionally over Tailscale VPN and with Slack notifications"

# The caller job chooses `runs-on` and `environment` (the environment name becomes part of the OIDC token subject).
# With OIDC the caller job needs `permissions: id-token: write` and `contents: read`.

inputs:
  aws-role-arn:
    description: "AWS IAM role ARN to chain-assume after the OIDC role. Empty means no chaining."
    required: false
    default: ""
  use-oidc:
    description: "Whether to use OIDC for assume role (`true` / `false`)"
    required: false
    default: "false"
  github-oidc-role-arn:
    description: "GitHub OIDC role ARN"
    required: false
    default: ""
  aws-region:
    description: "AWS region"
    required: false
    default: us-east-1
  aws-session-duration:
    description: "AWS session duration in seconds"
    required: false
    default: "3600"
  image-tag:
    description: "Tag given to container image"
    required: true
  repository:
    description: "Container repository"
    required: true
  registry:
    description: "Container registry"
    required: true
  docker-file-path:
    description: "Path to Dockerfile"
    required: false
    default: ./deploy/Dockerfile
  slack-channel-id:
    description: "Slack Channel ID"
    required: false
    default: ""
  set-node-version:
    description: "Put NODE_VERSION from the nvmrc file to docker build args (`true` / `false`)"
    required: false
    default: "true"
  nvmrc-path:
    description: "Path to nvmrc file"
    required: false
    default: .nvmrc
  docker-build-args:
    description: "Values for --build-arg argument, separated by whitespace"
    required: false
    # This is just a dummy default, so docker does not complain
    default: FOO=BAR
  docker-context:
    description: "Relative path to git context"
    required: false
    default: "."
  actor-override:
    description: "Override the author of event"
    required: false
    default: ""
  enable-vpn:
    description: "Enable VPN connection (`true` / `false`)"
    required: false
    default: "false"
  tailscale-ping:
    description: "Tailscale ping target"
    required: false
    # Production EKS cluster DNS name to test the VPN connection
    default: BA6D21AB896DE795C7BF29050D03C3A8.gr7.us-east-1.eks.amazonaws.com
  aws-access-key-id:
    description: "AWS access key ID (when not using OIDC)"
    required: false
    default: ""
  aws-secret-access-key:
    description: "AWS secret access key (when not using OIDC)"
    required: false
    default: ""
  slack-token:
    description: "Slack API token"
    required: false
    default: ""
  npm-token:
    description: "Put NPM_TOKEN to docker build args"
    required: false
    default: ""
  build-secret-env-vars:
    description: |
      Secrets passed to build as secret file (comma-separated).
      See https://docs.docker.com/engine/reference/commandline/buildx_build/#secret
    required: false
    default: ""
  ts-oauth-client-id:
    description: "Tailscale OAuth Client ID"
    required: false
    default: ""
  ts-oauth-secret:
    description: "Tailscale OAuth Client Secret"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Send notification to slack
      if: inputs.slack-channel-id != ''
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        payload: |
          {
            "channel": "${{ inputs.slack-channel-id }}",
            "text": ":large_blue_circle: *${{ github.repository }} build started*",
            "attachments": [
              {
                "color": "#0066ff",
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Author:* ${{ inputs.actor-override || github.actor }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Revision:* ${{ inputs.image-tag }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Details:* <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|trigger>, <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered by:* ${{ github.event_name }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }

    - name: clone repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: set docker build args and secrets
      shell: bash
      env:
        DOCKER_BUILD_ARGS: ${{ inputs.docker-build-args }}
        SET_NODE_VERSION: ${{ inputs.set-node-version }}
        NVMRC_PATH: ${{ inputs.nvmrc-path }}
        BUILD_SECRET_ENV_VARS: ${{ inputs.build-secret-env-vars }}
      run: |
        # Intentional word splitting of the whitespace-separated args
        BUILD_ARGS=( $DOCKER_BUILD_ARGS )
        if [ "$SET_NODE_VERSION" = true ]; then
            BUILD_ARGS+=(NODE_VERSION=$(head -1 "$NVMRC_PATH"))
        fi

        echo 'BUILD_ARGS<<EOF' >> $GITHUB_ENV
        printf "%s\n" "${BUILD_ARGS[@]}" >> $GITHUB_ENV
        echo 'EOF' >> $GITHUB_ENV

        # Create secret file for build
        if [ -n "$BUILD_SECRET_ENV_VARS" ]; then
            echo "$BUILD_SECRET_ENV_VARS" | tr ',' '\n' > "${RUNNER_TEMP}/build-secret-env-vars.txt"
        fi

    - name: Tailscale VPN
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      if: inputs.enable-vpn == 'true'
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci-mongodb-only
        version: latest
        ping: ${{ inputs.tailscale-ping }}

    # 100.100.100.100 is Tailscale's resolver on the runner. Host network makes
    # that address reachable from RUN. Without an explicit nameserver, BuildKit
    # copies systemd-resolved's upstream file, which on GitHub runners is Azure
    # DNS (168.63.129.16) and returns public Atlas addresses.
    - name: BuildKit DNS config
      if: inputs.enable-vpn == 'true'
      shell: bash
      run: |
        cat > "${RUNNER_TEMP}/buildkitd-vpn.toml" <<'EOF'
        [dns]
          nameservers=["100.100.100.100"]
        EOF

    # driver-opts attaches the BuildKit daemon to the runner network so image
    # pulls can use the tailnet. RUN steps do not inherit it; the build step sets that.
    - name: setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: ${{ inputs.enable-vpn == 'true' && 'network=host' || '' }}
        buildkitd-config: ${{ inputs.enable-vpn == 'true' && format('{0}/buildkitd-vpn.toml', runner.temp) || '' }}

    # First assume GithubOIDCRole role, the trust relationship between GitHub and AWS is defined in IAM GithubOIDCRole in the organization account. This role has permissions to assume Deployer roles only.
    - name: assume GithubOIDCRole
      if: inputs.use-oidc == 'true'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.github-oidc-role-arn }}
        role-duration-seconds: ${{ inputs.aws-session-duration }}

        # This parameter is needed otherwise this action is trying to tag session
        # which does not work for cross-account assume
        role-skip-session-tagging: true

    # Then assume Deployer role, which can be assumed by GithubOIDCRole and has all the permissions needed to deploy cloudformation stacks.
    - name: assume Deployer role
      if: inputs.use-oidc == 'true' && inputs.aws-role-arn != ''
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role-arn }}
        role-duration-seconds: ${{ inputs.aws-session-duration }}
        role-chaining: true
        role-skip-session-tagging: true

    - name: login to AWS ECR using OIDC
      if: inputs.use-oidc == 'true'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

    - name: login to AWS ECR
      if: inputs.use-oidc != 'true'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.aws-access-key-id }}
        password: ${{ inputs.aws-secret-access-key }}

    - name: build and push
      id: build_and_push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.docker-context }}
        file: ${{ inputs.docker-file-path }}
        # Host network so RUN can reach 100.100.100.100. The nameserver is set above.
        network: ${{ inputs.enable-vpn == 'true' && 'host' || '' }}
        push: true
        tags: ${{ inputs.registry }}/${{ inputs.repository }}:${{ inputs.image-tag }}
        secret-files: SECRET_ENV_VARS=${{ runner.temp }}/build-secret-env-vars.txt
        build-args: |
          ${{ env.BUILD_ARGS }}
          NPM_TOKEN=${{ inputs.npm-token }}

    - name: helper - get slack message attachment color
      id: helper
      if: always() && inputs.slack-channel-id != ''
      shell: bash
      run: |
        if [ "${{ job.status }}" = "success" ]
        then
            echo "color=#00cc00" >> $GITHUB_OUTPUT
            echo "emoji=large_green_circle" >> $GITHUB_OUTPUT
        else
            echo "color=#ff0000" >> $GITHUB_OUTPUT
            echo "emoji=red_circle" >> $GITHUB_OUTPUT
        fi

    - name: send result to slack
      if: always() && inputs.slack-channel-id != ''
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: chat.postMessage
        token: ${{ inputs.slack-token }}
        payload: |
          {
            "channel": "${{ inputs.slack-channel-id }}",
            "text": ":${{ steps.helper.outputs.emoji }}: *${{ github.repository }} build result: ${{ job.status }}*",
            "attachments": [
              {
                "color": "${{ steps.helper.outputs.color }}",
                "blocks": [
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Author:* ${{ inputs.actor-override || github.actor }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Revision:* ${{ inputs.image-tag }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Details:* <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|trigger>, <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run>"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Triggered by:* ${{ github.event_name }}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
